<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" height="280">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Card Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Animation for Pulse Dots -->
    <style>
      @keyframes pulse {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.9; transform: scale(1.15); }
      }
      @keyframes flowLine {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .dot1 { animation: pulse 3s infinite ease-in-out; transform-origin: 800px 70px; }
      .dot2 { animation: pulse 4s infinite ease-in-out 1s; transform-origin: 720px 220px; }
      .dot3 { animation: pulse 3.5s infinite ease-in-out 0.5s; transform-origin: 100px 220px; }
      .flow-path { stroke-dasharray: 8 6; animation: flowLine 15s linear infinite; }
    </style>
  </defs>

  <!-- Background Rect -->
  <rect width="900" height="280" rx="16" fill="url(#bgGrad)" stroke="#312e81" stroke-width="1.5"/>

  <!-- Background Grid Network -->
  <g stroke="#374151" stroke-width="0.75" opacity="0.4">
    <line x1="0" y1="70" x2="900" y2="70"/>
    <line x1="0" y1="140" x2="900" y2="140"/>
    <line x1="0" y1="210" x2="900" y2="210"/>
    <line x1="150" y1="0" x2="150" y2="280"/>
    <line x1="300" y1="0" x2="300" y2="280"/>
    <line x1="450" y1="0" x2="450" y2="280"/>
    <line x1="600" y1="0" x2="600" y2="280"/>
    <line x1="750" y1="0" x2="750" y2="280"/>
  </g>

  <!-- Dynamic Glowing Flow Lines in Background -->
  <path class="flow-path" d="M 50,140 Q 200,40 450,140 T 850,140" fill="none" stroke="#6366f1" stroke-width="2" opacity="0.5"/>
  <path class="flow-path" d="M 80,220 Q 300,260 550,180 T 820,60" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>

  <!-- Background Glowing Node Orbs (Behind text) -->
  <circle class="dot1" cx="800" cy="70" r="45" fill="#818cf8" opacity="0.15" filter="url(#glow)"/>
  <circle class="dot2" cx="720" cy="220" r="55" fill="#38bdf8" opacity="0.12" filter="url(#glow)"/>
  <circle class="dot3" cx="100" cy="220" r="40" fill="#c084fc" opacity="0.12" filter="url(#glow)"/>

  <!-- Dynamic Floating Status Pills (Flanking, cleanly clear of main text) -->
  <g transform="translate(640, 35)">
    <rect width="180" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-width="1" opacity="0.9"/>
    <circle cx="20" cy="17" r="5" fill="#4ade80"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">⚡ 95% AI Match Rate</text>
  </g>

  <g transform="translate(670, 210)">
    <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-width="1" opacity="0.9"/>
    <circle cx="20" cy="17" r="5" fill="#38bdf8"/>
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🔗 Native ERP Posting</text>
  </g>

  <!-- FOREGROUND TEXT (Crisp, completely unobscured) -->
  <!-- Top Category Tag -->
  <g transform="translate(50, 48)">
    <rect width="240" height="26" rx="6" fill="#312e81" opacity="0.8"/>
    <text x="12" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#a5b4fc" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
  </g>

  <!-- Title Header -->
  <text x="50" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">
    Awesome Cash Application Automation
  </text>

  <!-- Subtitle -->
  <text x="50" y="152" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8">
    Top Enterprise SaaS Platforms &amp; Open-Source Financial Reconciliation Engines
  </text>

  <!-- Feature Highlights Row -->
  <g transform="translate(50, 195)">
    <!-- Feature 1 -->
    <rect x="0" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">📥 Remittance Capture</text>

    <!-- Feature 2 -->
    <rect x="175" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">🧩 Invoice Matching</text>

    <!-- Feature 3 -->
    <rect x="350" y="0" width="160" height="42" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="15" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#cbd5e1">⚖️ Deduction Routing</text>
  </g>
</svg>
